<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - La Bella Restaurant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-login-container {
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-logo-section {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            animation: fadeIn 0.8s ease-out;
        }

        .admin-logo-section h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .admin-logo-section p {
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .admin-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .admin-card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out 0.1s both;
        }

        .admin-card h2 {
            font-size: 1.6rem;
            color: #2d3748;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .admin-card .subtitle {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #cbd5e0;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .remember-forgot a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            display: block;
            color: #e53e3e;
            font-size: 0.9rem;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff5f5;
            border-left: 3px solid #e53e3e;
            border-radius: 4px;
            animation: slideUp 0.3s ease-out;
            min-height: 0;
        }

        .success-message {
            display: block;
            color: #22543d;
            font-size: 0.9rem;
            margin-bottom: 15px;
            padding: 10px;
            background: #f0fff4;
            border-left: 3px solid #48bb78;
            border-radius: 4px;
            animation: slideUp 0.3s ease-out;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .security-info {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #f0fff4;
            border-radius: 8px;
            color: #22543d;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .admin-footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
        }

        .demo-credentials {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            color: white;
            font-size: 0.85rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .demo-credentials strong {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .demo-credentials code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            display: block;
            margin: 3px 0;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <!-- Logo Section -->
        <div class="admin-logo-section">
            <h1>👨‍💼 La Bella</h1>
            <p>Admin Management System</p>
            <div class="admin-badge">Secure Admin Access</div>
        </div>

        <!-- Login Card -->
        <div class="admin-card">
            <h2>Admin Login</h2>
            <p class="subtitle">Enter your credentials to access the admin dashboard</p>

            <div id="errorMessage"></div>
            <div id="successMessage"></div>

            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <input 
                        type="text" 
                        id="adminUsername" 
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input 
                        type="password" 
                        id="adminPassword" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="remember-forgot">
                    <label style="display: flex; align-items: center; gap: 6px; margin: 0;">
                        <input type="checkbox" id="rememberMe" style="width: 16px; height: 16px; cursor: pointer;">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="loginBtnText">Login</span>
                    <span id="loginSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="security-info">
                🔒 Your login credentials are securely encrypted
            </div>

          
        </div>

        <!-- Footer -->
        <div class="admin-footer">
            <p>&copy; 2025 La Bella Restaurant. Admin Panel.</p>
        </div>
    </div>

    <script src="admin-login.js"></script>
</body>
</html>
