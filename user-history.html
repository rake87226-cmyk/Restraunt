<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order & Reservation History - La Bella</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #f7fafc;
        }

        .history-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .history-header h1 {
            font-size: 2rem;
            color: #2d3748;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
        }

        .filter-tab {
            background: none;
            border: none;
            padding: 12px 16px;
            font-weight: 600;
            color: #a0aec0;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .filter-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .history-list {
            display: grid;
            gap: 16px;
        }

        .history-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .history-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d3748;
        }

        .card-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-completed {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-pending {
            background: #feebc8;
            color: #7c2d12;
        }

        .status-confirmed {
            background: #bee3f8;
            color: #2c5aa0;
        }

        .card-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .detail-item {
            border-left: 3px solid #667eea;
            padding-left: 12px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
            margin-top: 4px;
        }

        .order-items {
            background: #f7fafc;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }

        .order-items-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .order-item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .order-item-list li {
            padding: 4px 0;
            font-size: 0.9rem;
            color: #4a5568;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        .empty-state-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .empty-state-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <header class="nav">
        <div class="container">
            <h1 class="brand">La Bella</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="reservation.html">Reservation</a>
                <a href="contact.html">Contact</a>
                <a href="feedback.html">Feedback</a>
            </nav>
        </div>
    </header>

    <div class="history-container">
        <div class="history-header">
            <h1>📋 Your History</h1>
            <a href="index.html" class="back-btn">← Back Home</a>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterHistory('all')">All</button>
            <button class="filter-tab" onclick="filterHistory('orders')">Orders</button>
            <button class="filter-tab" onclick="filterHistory('reservations')">Reservations</button>
        </div>

        <div class="history-list" id="historyList">
            <div style="text-align: center; padding: 40px; color: #a0aec0;">Loading...</div>
        </div>
    </div>

    <script>
        let allHistory = {
            orders: [],
            reservations: []
        };
        let currentFilter = 'all';

        async function loadFullHistory() {
            const userEmail = localStorage.getItem('userEmail');
            if (!userEmail) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('/api/user/history/full', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await response.json();

                if (data.success) {
                    allHistory = data;
                    displayHistory();
                } else {
                    showEmptyState('Error loading history');
                }
            } catch (error) {
                console.error('Error loading history:', error);
                showEmptyState('Error loading history');
            }
        }

        function filterHistory(type) {
            currentFilter = type;
            

            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            displayHistory();
        }

        function displayHistory() {
            const historyList = document.getElementById('historyList');
            let items = [];

            if (currentFilter === 'all' || currentFilter === 'orders') {
                items = items.concat(allHistory.orders.map(o => ({ ...o, type: 'order' })));
            }
            if (currentFilter === 'all' || currentFilter === 'reservations') {
                items = items.concat(allHistory.reservations.map(r => ({ ...r, type: 'reservation' })));
            }

            if (items.length === 0) {
                showEmptyState('No ' + (currentFilter === 'all' ? '' : currentFilter.slice(0, -1)) + ' history yet');
                return;
            }

        
            items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let html = '';
            items.forEach(item => {
                if (item.type === 'order') {
                    html += buildOrderCard(item);
                } else {
                    html += buildReservationCard(item);
                }
            });

            historyList.innerHTML = html;
        }

        function buildOrderCard(order) {
            const date = new Date(order.created_at);
            const formattedDate = date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            let statusClass = 'status-pending';
            if (order.status === 'completed' || order.status === 'paid') statusClass = 'status-completed';
            else if (order.status === 'confirmed') statusClass = 'status-confirmed';

            return `
                <div class="history-card">
                    <div class="card-header">
                        <div class="card-title">🍕 Order #${order.id}</div>
                        <span class="card-status ${statusClass}">${(order.status || 'pending').toUpperCase()}</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-item">
                            <div class="detail-label">Date</div>
                            <div class="detail-value">${formattedDate}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Amount</div>
                            <div class="detail-value">₹${order.total ? order.total.toFixed(2) : '0.00'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Customer</div>
                            <div class="detail-value">${order.customer_name}</div>
                        </div>
                    </div>
                    ${order.items_summary ? `
                        <div class="order-items">
                            <div class="order-items-title">Items Ordered:</div>
                            <div style="font-size: 0.9rem; color: #4a5568;">${order.items_summary}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function buildReservationCard(reservation) {
            const createdDate = new Date(reservation.created_at);
            const formattedCreated = createdDate.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric'
            });

            let statusClass = 'status-pending';
            if (reservation.status === 'confirmed') statusClass = 'status-confirmed';
            else if (reservation.status === 'cancelled') statusClass = 'status-pending';

            return `
                <div class="history-card">
                    <div class="card-header">
                        <div class="card-title">🪑 Reservation #${reservation.id}</div>
                        <span class="card-status ${statusClass}">${(reservation.status || 'pending').toUpperCase()}</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-item">
                            <div class="detail-label">Reservation Date</div>
                            <div class="detail-value">${reservation.date} at ${reservation.time}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Party Size</div>
                            <div class="detail-value">${reservation.party_size} Guests</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Booked On</div>
                            <div class="detail-value">${formattedCreated}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Name</div>
                            <div class="detail-value">${reservation.name}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showEmptyState(message) {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">${message}</div>
                    <a href="menu.html" class="empty-state-link">Start Ordering</a>
                </div>
            `;
        }

        
        window.addEventListener('DOMContentLoaded', loadFullHistory);
    </script>
</body>
</html>
